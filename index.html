<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Directorio voluntariado</title>
<style>
:root{--bg:#f3f7f6;--card:#fff;--ink:#17302c;--muted:#5d7571;--brand:#0b8a6f;--brand-d:#076a55;--brand-l:#d9f0ea;--line:#dbe6e3;--hero1:#0b8a6f;--hero2:#065a48;--shadow:0 1px 2px rgba(10,50,40,.06),0 8px 24px rgba(10,50,40,.07)}
@media (prefers-color-scheme:dark){:root{--bg:#0f1b19;--card:#172725;--ink:#e6f2ef;--muted:#9bb5b0;--brand:#3cc4a3;--brand-d:#7fe0c6;--brand-l:#1d3a35;--line:#27403b;--hero1:#12705b;--hero2:#0a4a3c;--shadow:none}}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
a{color:inherit;text-decoration:none}
button{font:inherit;cursor:pointer}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.top{position:sticky;top:0;z-index:10;display:flex;gap:16px;align-items:center;justify-content:space-between;padding:12px clamp(16px,4vw,40px);background:var(--bg);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;letter-spacing:-.01em}
.logo{width:34px;height:34px;border-radius:10px;background:var(--brand);display:grid;place-items:center;color:#fff;flex:none}
.logo svg{width:20px;height:20px}
.search input{width:min(340px,46vw);padding:10px 16px;border-radius:999px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:inherit}
.search input:focus{outline:2px solid var(--brand);outline-offset:1px}
main{max-width:1100px;margin:0 auto;padding:24px clamp(16px,4vw,40px) 60px;min-height:70vh}
.hero{padding:36px 0 8px}
.hero h1{font-size:clamp(2rem,6vw,3.3rem);line-height:1.05;margin:0 0 10px;letter-spacing:-.03em}
.hero p{margin:0;color:var(--muted);font-size:1.1rem}
.big{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:18px;margin-top:28px}
.bigcard{display:flex;flex-direction:column;gap:4px;padding:28px;border-radius:22px;background:linear-gradient(140deg,var(--hero1),var(--hero2));color:#fff;box-shadow:var(--shadow);transition:transform .15s}
.bigcard:hover,.bigcard:focus-visible{transform:translateY(-3px)}
.bigcard svg{width:46px;height:46px;margin-bottom:10px}
.bigcard strong{font-size:1.5rem;letter-spacing:.05em}
.bigcard span{opacity:.88}
.crumbs{font-size:.92rem;color:var(--muted);margin-bottom:14px}
.crumbs a{color:var(--brand-d);font-weight:600}
.crumbs a:hover{text-decoration:underline}
h2{font-size:clamp(1.5rem,4vw,2.1rem);letter-spacing:-.02em;margin:0 0 6px}
.sub{color:var(--muted);margin:0 0 20px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 20px}
.chip{padding:8px 16px;border-radius:999px;border:1px solid var(--line);background:var(--card);color:var(--ink)}
.chip[aria-pressed=true]{background:var(--brand);border-color:var(--brand);color:#fff}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.tile{display:flex;flex-direction:column;gap:2px;padding:18px;border-radius:18px;background:var(--card);border:1px solid var(--line);box-shadow:var(--shadow);transition:transform .15s,border-color .15s;min-height:130px}
.tile:hover,.tile:focus-visible{transform:translateY(-3px);border-color:var(--brand)}
.tile .num{align-self:flex-start;min-width:32px;padding:2px 10px;border-radius:999px;background:var(--brand-l);color:var(--brand-d);font-weight:700;font-size:.85rem;text-align:center;margin-bottom:8px}
.tile strong{font-size:1.08rem;line-height:1.25}
.tile .loc{color:var(--muted);font-size:.92rem}
.tile .who{margin-top:auto;padding-top:8px;font-size:.92rem;color:var(--brand-d);font-weight:600}
.pc{display:flex;flex-direction:column;gap:2px;padding:20px;border-radius:18px;background:var(--card);border:1px solid var(--line);box-shadow:var(--shadow)}
.pc .eb{font-size:.8rem;text-transform:uppercase;letter-spacing:.06em;color:var(--brand-d);font-weight:700}
.pc h3{margin:2px 0 0;font-size:1.2rem;line-height:1.25}
.head{display:flex;align-items:center;gap:14px;margin-bottom:12px}
.av{width:56px;height:56px;border-radius:50%;object-fit:cover;flex:none;background:var(--brand-l)}
.ini{display:grid;place-items:center;color:var(--brand-d);font-weight:700;font-size:1.1rem}
.line{display:flex;align-items:baseline;gap:10px;padding:7px 0;border-top:1px solid var(--line)}
.line .k{flex:none;width:76px;font-size:.82rem;color:var(--muted)}
.line .v{flex:1;min-width:0;overflow-wrap:anywhere}
.line a.v{color:var(--brand-d);font-weight:600}
.line a.v:hover{text-decoration:underline}
.copy{flex:none;border:1px solid var(--line);background:transparent;color:var(--muted);border-radius:8px;padding:2px 10px;font-size:.8rem}
.copy:hover{border-color:var(--brand);color:var(--brand-d)}
.more{margin-top:10px;font-weight:600;color:var(--brand-d)}
.detail{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px;max-width:820px}
.empty{padding:40px 0;color:var(--muted)}
footer{text-align:center;color:var(--muted);font-size:.85rem;padding:0 16px 30px}
#toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,20px);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:999px;opacity:0;pointer-events:none;transition:.2s;font-size:.92rem}
#toast.on{opacity:1;transform:translate(-50%,0)}
a:focus-visible,button:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
@media (max-width:560px){.brand span:last-child{display:none}.search input{width:62vw}}
</style>

<script>
// ==PURE-START
const norm=s=>(s||'').normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase().trim();
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function parseCSV(text){
  text=text.replace(/^﻿/,'');
  const first=text.split(/\r?\n/)[0]||'';
  const delim=first.split(';').length>first.split(',').length?';':',';
  const rows=[];let row=[],cell='',q=false;
  for(let i=0;i<text.length;i++){
    const c=text[i];
    if(q){
      if(c==='"'){ if(text[i+1]==='"'){cell+='"';i++;} else q=false; }
      else cell+=c;
    }else if(c==='"') q=true;
    else if(c===delim){row.push(cell);cell='';}
    else if(c==='\n'||c==='\r'){
      if(c==='\r'&&text[i+1]==='\n')i++;
      row.push(cell);cell='';
      if(row.some(x=>x.trim()!==''))rows.push(row);
      row=[];
    }else cell+=c;
  }
  if(cell!==''||row.length){row.push(cell);if(row.some(x=>x.trim()!==''))rows.push(row);}
  return rows;
}
const FIELDS={
  tipo:['tipo'],
  num:['nº','n','no','num','numero'],
  lugar:['hospital / area','hospital/area','hospital','area','centro'],
  localidad:['localidad','municipio','ciudad'],
  cargo:['cargo','rol'],
  nombre:['nombre','contacto','persona'],
  tel:['telefono','tel','movil'],
  email:['email','correo','e-mail'],
  despacho:['ubicacion despacho','ubicacion','despacho'],
  horario:['horario'],
  resp:['responsable','zona'],
  foto:['foto','imagen','fotografia']
};
function buildData(text){
  const rows=parseCSV(text);
  const head=(rows.shift()||[]).map(norm);
  const idx={};
  for(const k in FIELDS) idx[k]=head.findIndex(h=>FIELDS[k].includes(h));
  const all=rows.map(r=>{const o={};for(const k in FIELDS)o[k]=idx[k]>=0?(r[idx[k]]||'').trim():'';return o;})
    .filter(o=>o.lugar||o.nombre);
  const sede=all.filter(o=>norm(o.tipo)==='sede');
  const map=new Map();
  all.filter(o=>norm(o.tipo)!=='sede').forEach(o=>{
    if(!map.has(o.lugar))map.set(o.lugar,{lugar:o.lugar,num:parseInt(o.num,10)||999,localidad:o.localidad,resp:o.resp,contacts:[]});
    map.get(o.lugar).contacts.push(o);
  });
  const hosp=[...map.values()].sort((a,b)=>a.num-b.num||a.lugar.localeCompare(b.lugar,'es'));
  return {all,sede,hosp};
}
// ==PURE-END

let D={all:[],sede:[],hosp:[]},fallbackUsed=false,filtro='';
const app=document.getElementById('app'),qi=document.getElementById('q');

const row=(k,v,href)=>v?`<div class="line"><span class="k">${k}</span>${href?`<a class="v" href="${esc(href)}">${esc(v)}</a><button class="copy" data-copy="${esc(v)}" aria-label="Copiar ${k.toLowerCase()}">Copiar</button>`:`<span class="v">${esc(v)}</span>`}</div>`:'';
const phones=t=>(t||'').split('/').map(s=>s.trim()).filter(Boolean).map(p=>row('Teléfono',p,'tel:'+p.replace(/[^\d+]/g,''))).join('');
const ini=n=>(n||'?').split(/\s+/).filter(Boolean).slice(0,2).map(w=>w[0]).join('').toUpperCase();
const avatar=o=>o.foto?`<img class="av" src="${esc(o.foto)}" alt="${esc(o.nombre)}" data-ini="${esc(ini(o.nombre))}" loading="lazy">`:`<span class="av ini" aria-hidden="true">${esc(ini(o.nombre))}</span>`;
document.addEventListener('error',e=>{const i=e.target;if(i&&i.tagName==='IMG'&&i.classList.contains('av')){const s=document.createElement('span');s.className='av ini';s.setAttribute('aria-hidden','true');s.textContent=i.dataset.ini||'?';i.replaceWith(s);}},true);
function card(o,eyebrow,href){
  return `<article class="pc"><div class="head">${avatar(o)}<div><div class="eb">${esc(eyebrow)}</div><h3>${esc(o.nombre||'—')}</h3></div></div>${phones(o.tel)}${row('Email',o.email,'mailto:'+o.email)}${row('Despacho',o.despacho)}${row('Horario',o.horario)}${href?`<a class="more" href="${href}">Ver hospital →</a>`:''}</article>`;
}
const crumbs=list=>`<nav class="crumbs" aria-label="Ruta">${list.map(([t,h])=>h?`<a href="${h}">${esc(t)}</a>`:esc(t)).join(' / ')}</nav>`;
const hospHref=l=>'#/hospital/'+encodeURIComponent(l);

function viewHome(){
  app.innerHTML=`<section class="hero"><h1>Directorio voluntariado</h1><p>Contactos de la sede y de la coordinación en cada hospital.</p>
  <div class="big">
   <a class="bigcard" href="#/sede"><svg viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="6" width="30" height="36" rx="3"/><path d="M17 15h4M27 15h4M17 23h4M27 23h4M20 42v-8h8v8"/></svg><strong>SEDE</strong><span>${D.sede.length} contactos</span></a>
   <a class="bigcard" href="#/hospitales"><svg viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><rect x="6" y="10" width="36" height="32" rx="4"/><path d="M24 18v16M16 26h16"/></svg><strong>HOSPITALES</strong><span>${D.hosp.length} hospitales</span></a>
  </div></section>`;
}
function viewSede(){
  app.innerHTML=crumbs([['Inicio','#/'],['Sede']])+`<h2>Sede de Madrid</h2><p class="sub">Cada persona, según su área de responsabilidad.</p><div class="grid">${D.sede.map(o=>card(o,o.lugar)).join('')||'<p class="empty">No hay contactos de sede.</p>'}</div>`;
}
function viewHospitales(){
  const resps=[...new Set(D.hosp.map(h=>h.resp).filter(Boolean))];
  const list=D.hosp.filter(h=>!filtro||h.resp===filtro);
  app.innerHTML=crumbs([['Inicio','#/'],['Hospitales']])+`<h2>Hospitales</h2><p class="sub">Pulsa un hospital para ver a su coordinador/a.</p>`+
   (resps.length>1?`<div class="chips" role="group" aria-label="Filtrar por responsable"><button class="chip" data-f="" aria-pressed="${!filtro}">Todos</button>${resps.map(r=>`<button class="chip" data-f="${esc(r)}" aria-pressed="${filtro===r}">${esc(r)}</button>`).join('')}</div>`:'')+
   `<div class="grid">${list.map(h=>{const names=[...new Set(h.contacts.map(c=>c.nombre).filter(Boolean))].join(' · ');
     return `<a class="tile" href="${hospHref(h.lugar)}">${h.num<999?`<span class="num">${h.num}</span>`:''}<strong>${esc(h.lugar)}</strong><span class="loc">${esc(h.localidad)}</span><span class="who">${esc(names)}</span></a>`;}).join('')}</div>`;
}
function viewHospital(name){
  const h=D.hosp.find(x=>x.lugar===name);
  if(!h){app.innerHTML=crumbs([['Inicio','#/'],['Hospitales','#/hospitales']])+'<p class="empty">No encuentro ese hospital.</p>';return;}
  app.innerHTML=crumbs([['Inicio','#/'],['Hospitales','#/hospitales'],[h.lugar]])+`<h2>${esc(h.lugar)}</h2><p class="sub">${esc(h.localidad)}</p><div class="detail">${h.contacts.map(c=>card(c,c.cargo||'Coordinación')).join('')}</div>`;
}
function viewSearch(q){
  const toks=norm(q).split(/\s+/).filter(Boolean);
  const res=D.all.filter(o=>{const hay=norm([o.lugar,o.localidad,o.cargo,o.nombre,o.tel,o.email].join(' '));return toks.every(t=>hay.includes(t));});
  app.innerHTML=`<h2>Resultados</h2><p class="sub">${res.length} para «${esc(q)}»</p><div class="grid">${res.map(o=>{const isS=norm(o.tipo)==='sede';return card(o,[o.lugar,isS?'':o.localidad].filter(Boolean).join(' · '),isS?'':hospHref(o.lugar));}).join('')||'<p class="empty">Sin resultados.</p>'}</div>`;
}
function route(){
  const parts=(location.hash.slice(1)||'/').split('/');
  const a=parts[1]||'',b=parts[2]?decodeURIComponent(parts[2]):'';
  if(a==='sede')viewSede();else if(a==='hospitales')viewHospitales();else if(a==='hospital')viewHospital(b);else viewHome();
  window.scrollTo(0,0);
}
function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(()=>t.classList.remove('on'),1600);}

window.addEventListener('hashchange',()=>{qi.value='';route();});
qi.addEventListener('input',()=>{const v=qi.value.trim();v.length>=2?viewSearch(v):route();});
app.addEventListener('click',e=>{
  const c=e.target.closest('[data-copy]');
  if(c){const v=c.dataset.copy;(navigator.clipboard?navigator.clipboard.writeText(v):Promise.reject()).then(()=>toast('Copiado'),()=>{const t=document.createElement('textarea');t.value=v;document.body.appendChild(t);t.select();try{document.execCommand('copy');toast('Copiado');}catch(_){}t.remove();});return;}
  const f=e.target.closest('[data-f]');
  if(f){filtro=f.dataset.f;viewHospitales();}
});

(async function(){
  let text;
  try{
    const r=await fetch('contactos.csv?v='+Date.now(),{cache:'no-store'});
    if(!r.ok)throw new Error(r.status);
    text=await r.text();
  }catch(e){
    text=document.getElementById('fallback').textContent.trim();
    fallbackUsed=true;
  }
  D=buildData(text);
  document.getElementById('foot').textContent=D.all.length+' contactos'+(fallbackUsed?' · vista previa con datos incluidos en la página':'');
  route();
})();
</script>
</body>
